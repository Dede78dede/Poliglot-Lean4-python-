# Pre-commit configuration for Polyglot Code Studio (Phase 13.9)
# Enforces Python PEP 8 compliance, Ruff linting & formatting, and Mypy strict type checks.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        additional_dependencies: [pydantic>=2.9.0]
        files: ^schemas/|^tests/.*\.py$
