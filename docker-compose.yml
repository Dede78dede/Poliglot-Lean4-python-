version: '3.9'

networks:
  polyglot-net:
    driver: bridge
  lean-isolated-net:
    driver: bridge
    internal: true # STRICT NO-RUNTIME-NETWORK ISOLATION (--internal=true)

volumes:
  mathlib-cache:
    driver: local

services:
  studio:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - LEAN_RUNNER_MODE=real
      - LEAN_RUNNER_URL=http://lean-runner:8080
      - LEAN_RUNNER_AUTH_TOKEN=${LEAN_RUNNER_AUTH_TOKEN:-}
      - PANTOGRAPH_URL=http://pantograph:8081
      - KIMINA_MODE=real
      - KIMINA_BASE_URL=${KIMINA_BASE_URL:-http://kimina-backend:8000}
      - KIMINA_URL=${KIMINA_BASE_URL:-http://kimina-backend:8000}
      - KIMINA_AUTH_TOKEN=${KIMINA_AUTH_TOKEN:-}
      - PIPELINE_STRICT_GOALS=false
      - WS_PORT=3000
      - CLAIM_TTL_MS=1800000
      - ENABLE_DUPER=false
      - ENABLE_LEANSAGE=false
    networks:
      - polyglot-net
    depends_on:
      lean-runner:
        condition: service_healthy
      pantograph:
        condition: service_healthy
      kimina-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/readyz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Dedicated Kimina Lean Server container implementing POST /api/check and GET /health
  kimina-backend:
    image: ${KIMINA_SERVER_IMAGE:-projectnumina/kimina-lean-server:latest}
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - KIMINA_AUTH_TOKEN=${KIMINA_AUTH_TOKEN:-}
    networks:
      - polyglot-net
      - lean-isolated-net
    volumes:
      - mathlib-cache:/root/.cache/mathlib:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  lean-runner:
    build:
      context: ./docker/lean-runner
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - LEAN_RUNNER_AUTH_TOKEN=${LEAN_RUNNER_AUTH_TOKEN:-}
    networks:
      - polyglot-net
      - lean-isolated-net
    volumes:
      - mathlib-cache:/home/leanrunner/.cache/mathlib
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/readyz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 16G

  pantograph:
    build:
      context: ./docker/pantograph
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8081:8081"
    networks:
      - polyglot-net
      - lean-isolated-net
    volumes:
      # Read-only mount prevents concurrent cache corruption
      - mathlib-cache:/root/.cache/mathlib:ro
    environment:
      - LEAN_TOOLCHAIN=leanprover/lean4:v4.33.1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/readyz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 8G
