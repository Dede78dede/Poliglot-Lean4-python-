version: '3.9'

networks:
  polyglot-net:
    driver: bridge
  lean-isolated-net:
    driver: bridge
    internal: true # STRICT NO-RUNTIME-NETWORK ISOLATION (--internal=true)

volumes:
  mathlib-cache:
    driver: local
  polyglot-projects:
    driver: local

services:
  studio:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - SESSION_STORE_ROOT=/workspace/projects
      - POLYGLOT_PROVENANCE_SECRET=${POLYGLOT_PROVENANCE_SECRET:?POLYGLOT_PROVENANCE_SECRET must be set (>= 32 chars)}
      - POLYGLOT_PROVENANCE_KEY_ID=${POLYGLOT_PROVENANCE_KEY_ID:-primary-v1}
      - CORS_ORIGINS=${CORS_ORIGINS:?CORS_ORIGINS is required in production}
      - LEAN_RUNNER_MODE=real
      - LEAN_RUNNER_URL=http://lean-runner:8080
      - LEAN_RUNNER_AUTH_TOKEN=${LEAN_RUNNER_AUTH_TOKEN:?LEAN_RUNNER_AUTH_TOKEN is required}
      - PANTOGRAPH_URL=http://pantograph:8081
      - KIMINA_MODE=real
      - KIMINA_BASE_URL=${KIMINA_BASE_URL:-http://kimina-backend:8000}
      - KIMINA_URL=${KIMINA_BASE_URL:-http://kimina-backend:8000}
      - KIMINA_AUTH_TOKEN=${KIMINA_AUTH_TOKEN:?KIMINA_AUTH_TOKEN is required}
      - PIPELINE_STRICT_GOALS=false
      - WS_PORT=3000
      - CLAIM_TTL_MS=1800000
      - ENABLE_DUPER=false
      - ENABLE_LEANSAGE=false
    volumes:
      - polyglot-projects:/workspace/projects:rw
    networks:
      - polyglot-net
      - lean-isolated-net
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      lean-runner:
        condition: service_healthy
      pantograph:
        condition: service_healthy
      kimina-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/readyz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Dedicated Kimina Lean Server container implementing POST /api/check and GET /health
  # Digest-pinned image reference required (never use floating :latest in production)
  kimina-backend:
    image: ${KIMINA_SERVER_IMAGE:?Set immutable digest-pinned KIMINA_SERVER_IMAGE (e.g. projectnumina/kimina-lean-server@sha256:...)}
    restart: unless-stopped
    environment:
      - KIMINA_AUTH_TOKEN=${KIMINA_AUTH_TOKEN:?KIMINA_AUTH_TOKEN is required}
    networks:
      - lean-isolated-net
    volumes:
      - mathlib-cache:/root/.cache/mathlib:ro
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  lean-runner:
    build:
      context: ./docker/lean-runner
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - SESSION_STORE_ROOT=/workspace/projects
      - LEAN_RUNNER_AUTH_TOKEN=${LEAN_RUNNER_AUTH_TOKEN:?LEAN_RUNNER_AUTH_TOKEN is required}
    networks:
      - lean-isolated-net
    volumes:
      - mathlib-cache:/home/leanrunner/.cache/mathlib
      - polyglot-projects:/workspace/projects:ro
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=512m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/readyz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 16G

  pantograph:
    build:
      context: ./docker/pantograph
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - lean-isolated-net
    volumes:
      # Read-only mount prevents concurrent cache corruption
      - mathlib-cache:/root/.cache/mathlib:ro
    environment:
      - LEAN_TOOLCHAIN=leanprover/lean4:v4.33.1
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/readyz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 8G
