name: Polyglot Code Studio CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint, Build & Verify All Suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Linter & Typecheck
        run: |
          npm run lint
          npx tsc --noEmit

      - name: Architecture Layer Rule Check
        run: npm run arch:check

      - name: Epistemic Authority Invariant Check
        run: npm run arch:check-epistemic-authority

      - name: Contract Parity Check
        run: npm run contracts:check

      - name: Feature Flag Governance Check
        run: npx tsx scripts/check-flag-expiry.ts

      - name: Build Application
        run: npm run build

      - name: Bundle Budget Measurement & Blocking Gate (ADR-017)
        run: |
          npm run bundle:measure
          node -e '
            const fs = require("fs");
            const reportPath = fs.existsSync("reports/bundle-post-14.9.9.2.json")
              ? "reports/bundle-post-14.9.9.2.json"
              : "reports/bundle-post-14.json";
            const report = JSON.parse(fs.readFileSync(reportPath, "utf-8"));
            if (report.status !== "PASS") {
              console.error("❌ Bundle Budget Exceeded: Main " + report.measured.mainEntryGzipKb + " KB, Total " + report.measured.totalJsGzipKb + " KB");
              process.exit(1);
            }
            console.log("✓ Bundle budget passed: " + report.measured.mainEntryGzipKb + " KB main, " + report.measured.totalJsGzipKb + " KB total JS (Budget <= 290 KB).");
          '

      - name: Run Primary Polyglot Verification Suite (Suites 134-172)
        run: npx tsx scripts/verify-all.ts

      - name: Run Extended Polyglot Verification Suite (Suites 173-200)
        run: npx tsx scripts/verify-extended.ts

      - name: Epistemic Seal Integrity Sweep (Final Gate)
        run: |
          chmod +x scripts/seal-integrity-sweep.sh
          ./scripts/seal-integrity-sweep.sh
