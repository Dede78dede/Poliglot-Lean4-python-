name: Polyglot Code Studio CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Build, Security, Architecture & Verification Suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Secret Scan
        run: npm run scan:secrets

      - name: Supply-Chain Vulnerability Audit
        run: npm audit --audit-level=high

      - name: Architecture Layer Rule Check
        run: npm run arch:check

      - name: Epistemic Authority Invariant Check
        run: npm run arch:check-epistemic-authority

      - name: Contract Parity Check
        run: npm run contracts:check

      - name: Feature Flag Governance Check (Strict)
        run: npx tsx scripts/check-flag-expiry.ts --strict

      - name: Build Application
        run: npm run build

      - name: Bundle Budget Gate (ADR-017)
        run: npm run bundle:measure

      - name: Run Primary Polyglot Verification Suite (Suites 134-172)
        run: npm test

      - name: Run Extended Polyglot Verification Suite (Suites 173-200)
        run: npm run test:extended

      - name: Epistemic Seal Integrity Sweep (Final Gate)
        run: |
          chmod +x scripts/seal-integrity-sweep.sh
          ./scripts/seal-integrity-sweep.sh
