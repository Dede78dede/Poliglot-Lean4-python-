name: Polyglot Code Studio CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint, Build & Verify All Suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Linter & Typecheck
        run: |
          npm run lint
          npx tsc --noEmit

      - name: Build Application
        run: npm run build

      - name: Bundle Budget Measurement & Warning Check (Task 13)
        run: |
          npm run bundle:measure
          node -e '
            const fs = require("fs");
            const report = JSON.parse(fs.readFileSync("reports/bundle-post-13.9.json", "utf-8"));
            if (report.status !== "PASS") {
              console.log("::warning title=Bundle Budget Exceeded::Main: " + report.measured.mainEntryGzipKb + " KB (Cap: 180 KB), Total: " + report.measured.totalJsGzipKb + " KB (Cap: 260 KB)");
            } else {
              console.log("Bundle budget check passed: " + report.measured.mainEntryGzipKb + " KB main, " + report.measured.totalJsGzipKb + " KB total JS.");
            }
          '

      - name: Run Complete Polyglot Verification Suite
        run: npx tsx scripts/verify-all.ts
